<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050706">
    <title>Impression Ticket</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050706;
            --text: rgba(255,255,255,.92);
            --muted: rgba(235,245,240,.55);
            --faint: rgba(235,245,240,.35);
            --green: #3ddc97;
            --green-strong: #1fbf7a;
            --danger: #ff6b6b;
            --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
            --ease-out: cubic-bezier(.2, .8, .2, 1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* —— Lumière de fond (WebGL, avec repli CSS) —— */
        #aurora {
            position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
            opacity: 0; transition: opacity 1.6s ease;
        }
        #aurora.on { opacity: 1; }
        .fallback-glow { position: fixed; inset: 0; z-index: 0; display: none; overflow: hidden; }
        .no-webgl .fallback-glow { display: block; }
        .fallback-glow div {
            position: absolute; border-radius: 50%; filter: blur(90px);
            width: 60vmax; height: 45vmax; left: 20%; top: 30%;
            background: radial-gradient(closest-side, #0f9d58, transparent);
            animation: appear 2.5s var(--ease-out) both, drift 24s ease-in-out 2.5s infinite alternate;
        }
        .fallback-glow div:nth-child(2) { left: 45%; top: 15%; width: 45vmax; background: radial-gradient(closest-side, #14b8a6, transparent); animation-duration: 2.5s, 30s; }
        @keyframes appear { from { opacity: 0; transform: scale(.3); } }
        @keyframes drift { to { transform: translate(-12vw, 8vh) scale(1.1); } }

        /* —— Verre liquide —— */
        .glass {
            position: relative;
            background: linear-gradient(180deg, rgba(48,52,50,.50), rgba(24,27,25,.42));
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            backdrop-filter: blur(40px) saturate(150%);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.22),
                inset 0 -1px 0 rgba(255,255,255,.04),
                0 24px 70px rgba(0,0,0,.45),
                0 2px 6px rgba(0,0,0,.25);
            isolation: isolate;
        }
        /* liseré lumineux en dégradé */
        .glass::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
            background: linear-gradient(140deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 30%, rgba(255,255,255,0) 55%, rgba(255,255,255,.18) 85%, rgba(255,255,255,.35));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; z-index: 2;
        }
        /* reflet spéculaire qui suit le pointeur */
        .glass::after {
            content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
            background: radial-gradient(420px circle at var(--mx, 50%) var(--my, -40%), rgba(255,255,255,.10), transparent 45%);
            opacity: 0; transition: opacity .4s;
        }
        .glass:hover::after, .glass:focus-within::after { opacity: 1; }

        /* —— Mise en page —— */
        main {
            position: relative; z-index: 1;
            min-height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 110px 16px 80px;
        }
        .intro { opacity: 0; transform: translateY(16px) scale(.98); filter: blur(6px); }
        body.ready .intro { opacity: 1; transform: none; filter: none; transition: opacity .9s var(--ease-out), transform .9s var(--ease-out), filter .9s var(--ease-out); }
        body.ready .intro.d1 { transition-delay: .1s; }
        body.ready .intro.d2 { transition-delay: .25s; }

        /* Sélecteur de mode */
        .modes {
            position: fixed; top: 22px; left: 50%; transform: translateX(-50%); z-index: 5;
            display: flex; padding: 5px; border-radius: 999px;
            max-width: calc(100% - 32px);
        }
        body.ready .modes.intro { transform: translateX(-50%); }
        .modes.intro { transform: translateX(-50%) translateY(-10px); }
        .modes .indicator {
            position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px;
            background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.1));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 14px rgba(0,0,0,.25);
            transition: left .5s var(--ease-spring), width .5s var(--ease-spring);
        }
        .modes button {
            position: relative; z-index: 1;
            font: inherit; font-size: 14.5px; font-weight: 500; color: var(--muted);
            background: transparent; border: 0; cursor: pointer;
            padding: 9px 18px; border-radius: 999px; white-space: nowrap;
            display: flex; align-items: center; gap: 7px;
            transition: color .3s;
        }
        .modes button svg { width: 15px; height: 15px; opacity: .85; }
        .modes button:hover, .modes button[aria-selected="true"] { color: var(--text); }

        h1 {
            font-weight: 300; font-size: clamp(30px, 5.2vw, 50px);
            letter-spacing: -.025em; text-align: center; margin: 0 0 10px;
        }
        .subtitle { color: var(--muted); text-align: center; margin: 0 0 34px; font-size: 16px; font-weight: 400; }

        .stage { width: 100%; max-width: 680px; display: grid; grid-template-columns: minmax(0, 1fr); }
        .panel {
            grid-area: 1 / 1; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; visibility: hidden; transform: translateY(10px) scale(.985);
            transition: opacity .35s var(--ease-out), transform .45s var(--ease-out), visibility 0s .45s;
        }
        .panel.active { opacity: 1; visibility: visible; transform: none; transition: opacity .45s var(--ease-out) .05s, transform .55s var(--ease-out) .05s, visibility 0s; }

        /* Carte façon Spotlight */
        .spot { width: 100%; border-radius: 26px; transition: box-shadow .3s; }
        .spot:focus-within { box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 24px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(61,220,151,.25), 0 0 60px rgba(61,220,151,.12); }
        .row { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px 18px 22px; }
        .row .lead { flex: 0 0 auto; width: 26px; height: 32px; display: grid; place-items: center; color: var(--muted); }
        .row .lead svg { width: 24px; height: 24px; }
        .row textarea, .row input {
            flex: 1; min-width: 0;
            font: inherit; font-size: 22px; font-weight: 400; letter-spacing: -.01em; color: var(--text);
            background: transparent; border: 0; outline: 0; resize: none;
            padding: 1px 0; line-height: 30px; max-height: 240px; caret-color: var(--green);
        }
        .row textarea::placeholder, .row input::placeholder { color: var(--faint); }
        .divider { height: 1px; margin: 0 18px; background: rgba(255,255,255,.08); }
        .sub {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 10px 12px 12px 22px; min-height: 60px;
        }
        .sub .label { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .sub .label svg { width: 16px; height: 16px; }
        .sub input {
            font: inherit; font-size: 15px; color: var(--text); caret-color: var(--green);
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
            border-radius: 12px; padding: 8px 12px; outline: 0; width: 170px;
            transition: border-color .2s, background .2s;
        }
        .sub input:focus { border-color: rgba(61,220,151,.45); background: rgba(255,255,255,.09); }
        .sub input::placeholder { color: var(--faint); }
        .sub .spacer { flex: 1; }
        .count { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }

        .invalid { animation: shake .4s; }
        .sub input.invalid { border-color: var(--danger); }
        @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

        /* Boutons */
        .btn {
            font: inherit; font-size: 15px; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 40px; padding: 0 18px; border-radius: 13px; border: 0; cursor: pointer;
            color: #03140c;
            background: linear-gradient(180deg, #5ef0ad, var(--green-strong));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 20px rgba(31,191,122,.35);
            transition: transform .2s var(--ease-spring), filter .2s, opacity .2s, box-shadow .2s;
        }
        .btn:hover { filter: brightness(1.07); }
        .btn:active { transform: scale(.95); }
        .btn:disabled { opacity: .35; cursor: default; box-shadow: none; filter: grayscale(.4); }
        .btn svg { width: 17px; height: 17px; }
        .btn.round { width: 40px; padding: 0; border-radius: 12px; }

        kbd {
            font: inherit; font-size: 12px; color: var(--faint);
            border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 1px 6px;
        }

        /* Priorité : contrôle segmenté */
        .seg { position: relative; display: flex; padding: 3px; border-radius: 12px; background: rgba(0,0,0,.22); box-shadow: inset 0 1px 2px rgba(0,0,0,.3); }
        .seg .indicator {
            position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 9px;
            background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
            transition: left .45s var(--ease-spring), width .45s var(--ease-spring);
        }
        .seg button {
            position: relative; z-index: 1; font: inherit; font-size: 13.5px; font-weight: 500;
            color: var(--muted); background: none; border: 0; cursor: pointer;
            padding: 7px 12px; border-radius: 9px; transition: color .25s;
        }
        .seg button[aria-pressed="true"] { color: var(--text); }

        .spinner {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2.5px solid rgba(3,20,12,.25); border-top-color: #03140c;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed; left: 50%; bottom: 30px; z-index: 10;
            transform: translate(-50%, 24px) scale(.96); opacity: 0;
            padding: 13px 22px; border-radius: 18px; font-size: 15px; font-weight: 500;
            transition: opacity .35s var(--ease-out), transform .5s var(--ease-spring);
            pointer-events: none; max-width: calc(100% - 32px); text-align: center;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
        .toast.err { color: #ffd2d2; }

        @media (max-width: 560px) {
            main { padding-top: 96px; }
            .modes button { padding: 8px 12px; font-size: 13.5px; }
            .modes button svg { display: none; }
            .row { padding: 15px 16px 15px 18px; gap: 10px; }
            .row textarea, .row input { font-size: 18px; line-height: 28px; }
            .sub { padding: 10px 10px 12px 18px; }
            .sub input { width: auto; flex: 1 1 120px; min-width: 0; }
            .sub .spacer { flex-basis: 100%; height: 0; }
            .sub .count { margin-left: auto; }
            .hint { display: none; }
            .spot { border-radius: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .intro, body.ready .intro { transition: opacity .4s; transform: none; filter: none; }
            .fallback-glow div { animation: none; }
        }
    </style>
</head>
<body>
    <canvas id="aurora" aria-hidden="true"></canvas>
    <div class="fallback-glow" aria-hidden="true"><div></div><div></div></div>

    <nav class="modes glass intro" role="tablist" id="modes">
        <span class="indicator"></span>
        <button type="button" role="tab" data-mode="message" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Écris-moi un message
        </button>
        <button type="button" role="tab" data-mode="tasks" aria-selected="false">
            <svg id="lockIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Tâches à faire
        </button>
    </nav>

    <main>
        <div class="stage">
            <!-- Mode message (public) -->
            <section class="panel active" id="panel-message">
                <h1 class="intro">Écris-moi un message</h1>
                <p class="subtitle intro d1">Il sortira directement de mon imprimante.</p>
                <form id="messageForm" class="spot glass intro d2">
                    <div class="row">
                        <span class="lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.2L4 17.2z"/><path d="M8 9h8M8 12h5"/></svg></span>
                        <textarea id="messageInput" rows="1" maxlength="500" placeholder="Écris ton message…" aria-label="Message"></textarea>
                    </div>
                    <div class="divider"></div>
                    <div class="sub">
                        <label class="label" for="nameInput"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>De la part de</label>
                        <input id="nameInput" placeholder="Ton prénom" maxlength="40" autocomplete="given-name">
                        <span class="spacer"></span>
                        <span class="count" id="messageCount">0/500</span>
                        <button type="submit" class="btn" id="messageSend" disabled>
                            Envoyer
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                        </button>
                    </div>
                </form>
            </section>

            <!-- Mode tâches : verrouillé -->
            <section class="panel" id="panel-locked">
                <h1>Tâches à faire</h1>
                <p class="subtitle">Cet espace est protégé par un mot de passe.</p>
                <form id="unlockForm" class="spot glass" style="max-width:480px">
                    <div class="row" style="align-items:center">
                        <span class="lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        <input id="passwordInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe">
                        <button type="submit" class="btn round" aria-label="Déverrouiller">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                        </button>
                    </div>
                </form>
            </section>

            <!-- Mode tâches : déverrouillé -->
            <section class="panel" id="panel-tasks">
                <h1>Qu'y a-t-il à faire ?</h1>
                <p class="subtitle">Écris la tâche, choisis sa priorité, imprime.</p>
                <form id="taskForm" class="spot glass">
                    <div class="row">
                        <span class="lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>
                        <textarea id="taskInput" rows="1" maxlength="300" placeholder="Entrez la tâche à imprimer…" aria-label="Tâche"></textarea>
                    </div>
                    <div class="divider"></div>
                    <div class="sub">
                        <div class="seg" id="prioritySeg" role="group" aria-label="Priorité">
                            <span class="indicator"></span>
                            <button type="button" data-p="0" aria-pressed="true">⚡️ Faible</button>
                            <button type="button" data-p="1" aria-pressed="false">⚡️⚡️ Moyen</button>
                            <button type="button" data-p="2" aria-pressed="false">⚡️⚡️⚡️ Élevé</button>
                        </div>
                        <span class="spacer"></span>
                        <span class="hint count"><kbd>↵</kbd></span>
                        <button type="submit" class="btn" id="taskSend" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                            Imprimer
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <div class="toast glass" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
    // ————————————————————————————————————————————
    // Lumière de fond : apparaît à l'arrivée, puis dérive en continu
    // ————————————————————————————————————————————
    const aurora = (() => {
        const canvas = document.getElementById('aurora');
        const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
        if (!gl) { document.body.classList.add('no-webgl'); return { setTasks() {} }; }

        const vert = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }';
        const frag = `
            precision highp float;
            uniform vec2 uRes; uniform float uTime; uniform float uIntro; uniform vec2 uMouse; uniform float uTasks;
            float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
            float noise(vec2 p){
                vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
                return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
            }
            float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++){ v += a*noise(p); p *= 2.02; a *= .5; } return v; }
            float blob(vec2 p, vec2 c, float r){ vec2 d = p - c; return exp(-dot(d, d) / (r*r)); }
            void main(){
                vec2 uv = (gl_FragCoord.xy - .5*uRes) / min(uRes.x, uRes.y);
                float t = uTime;
                float s = uIntro;                       // 0 → 1 pendant l'apparition
                vec2 w = uv + .22*vec2(fbm(uv*1.4 + t*.04), fbm(uv*1.4 - t*.035 + 7.)) - .11;

                vec2 c1 = s * vec2(.55*sin(t*.11), .22*cos(t*.13) - .12);
                vec2 c2 = s * vec2(.45*cos(t*.09 + 2.), .28*sin(t*.12 + 1.));
                vec2 c3 = s * vec2(.6*sin(t*.07 + 4.), .3*cos(t*.1 + 3.) - .25);
                vec2 c4 = mix(vec2(0.), uMouse, .35);

                float r = mix(.18, 1., s);
                vec3 emerald = mix(vec3(.04, .62, .34), vec3(.16, .70, .30), uTasks);
                vec3 teal    = mix(vec3(.03, .50, .52), vec3(.10, .58, .38), uTasks);
                vec3 lime    = mix(vec3(.30, .62, .08), vec3(.48, .66, .05), uTasks);

                vec3 col = vec3(0.);
                col += emerald * blob(w, c1, .50*r) * .80;
                col += teal    * blob(w, c2, .40*r) * .55;
                col += lime    * blob(w, c3, .36*r) * .35;
                col += emerald * blob(uv, c4, .30) * .20 * s;
                col *= .75 + .5*fbm(w*2.2 + t*.06);      // voiles d'aurore

                col = (1. - exp(-col * 1.1)) * .8 * uIntro;    // tonemapping doux
                vec3 base = vec3(.014, .018, .016);
                col = base + col * (1. - smoothstep(.3, 1.25, length(uv*vec2(.8, 1.))));
                col += (hash(gl_FragCoord.xy + fract(t)) - .5) / 90.;   // grain anti-banding
                gl_FragColor = vec4(col, 1.);
            }`;
        const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
        const prog = gl.createProgram();
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, vert));
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, frag));
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { document.body.classList.add('no-webgl'); return { setTasks() {} }; }
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(prog, 'p');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        const u = n => gl.getUniformLocation(prog, n);
        const uRes = u('uRes'), uTime = u('uTime'), uIntro = u('uIntro'), uMouse = u('uMouse'), uTasks = u('uTasks');

        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const SCALE = 0.5; // rendu en demi-résolution : c'est flou de toute façon
        function resize() {
            canvas.width = Math.max(1, Math.round(innerWidth * SCALE));
            canvas.height = Math.max(1, Math.round(innerHeight * SCALE));
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        addEventListener('resize', resize); resize();

        let mouse = [0, 0], target = [0, 0], tasks = 0, tasksTarget = 0;
        addEventListener('pointermove', e => {
            const m = Math.min(innerWidth, innerHeight);
            target = [(e.clientX - innerWidth / 2) / m, (innerHeight / 2 - e.clientY) / m];
        });

        const start = performance.now();
        const easeOut = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
        function frame(now) {
            const t = (now - start) / 1000;
            mouse[0] += (target[0] - mouse[0]) * .03; mouse[1] += (target[1] - mouse[1]) * .03;
            tasks += (tasksTarget - tasks) * .04;
            gl.uniform2f(uRes, canvas.width, canvas.height);
            gl.uniform1f(uTime, (reduced ? .25 : 1) * t + 10.);
            gl.uniform1f(uIntro, easeOut(t / 3.2));
            gl.uniform2f(uMouse, mouse[0], mouse[1]);
            gl.uniform1f(uTasks, tasks);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        requestAnimationFrame(() => canvas.classList.add('on'));
        return { setTasks(on) { tasksTarget = on ? 1 : 0; } };
    })();

    // ————————————————————————————————————————————
    // Interface
    // ————————————————————————————————————————————
    let tasksUnlocked = {{ 'true' if tasks_unlocked else 'false' }};
    const $ = (id) => document.getElementById(id);
    const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    // Reflet spéculaire du verre qui suit le pointeur
    document.addEventListener('pointermove', e => {
        document.querySelectorAll('.glass').forEach(el => {
            const r = el.getBoundingClientRect();
            el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
            el.style.setProperty('--my', (e.clientY - r.top) + 'px');
        });
    });

    // Indicateurs glissants (sélecteur de mode, priorité)
    function moveIndicator(container, btn) {
        const ind = container.querySelector('.indicator');
        ind.style.left = btn.offsetLeft + 'px';
        ind.style.width = btn.offsetWidth + 'px';
    }

    // Toast & confettis
    let toastTimer;
    function toast(text, ok = true) {
        const t = $('toast');
        t.textContent = text;
        t.className = 'toast glass show' + (ok ? '' : ' err');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.className = 'toast glass', 2800);
    }
    function launchConfetti() {
        if (typeof confetti !== 'function') return;
        confetti({ particleCount: 140, spread: 75, origin: { y: 0.6 }, colors: ['#3ddc97', '#1fbf7a', '#a3e635', '#5eead4', '#ffffff'] });
    }
    function shake(el) {
        el.classList.remove('invalid'); void el.offsetWidth; el.classList.add('invalid');
        setTimeout(() => el.classList.remove('invalid'), 1200);
    }

    // Modes
    const lockPath = $('lockIcon').innerHTML;
    const unlockPath = '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>';
    function setMode(mode) {
        document.querySelectorAll('.modes button').forEach(b => {
            b.setAttribute('aria-selected', b.dataset.mode === mode);
            if (b.dataset.mode === mode) moveIndicator($('modes'), b);
        });
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        let panel = 'panel-message';
        if (mode === 'tasks') panel = tasksUnlocked ? 'panel-tasks' : 'panel-locked';
        $(panel).classList.add('active');
        $('lockIcon').innerHTML = tasksUnlocked ? unlockPath : lockPath;
        aurora.setTasks(mode === 'tasks');
        if (matchMedia('(hover: hover)').matches) {
            const focusEl = { 'panel-message': $('messageInput'), 'panel-locked': $('passwordInput'), 'panel-tasks': $('taskInput') }[panel];
            setTimeout(() => focusEl.focus({ preventScroll: true }), 80);
        }
        if (panel === 'panel-tasks') requestAnimationFrame(renderPriority);
        store.set('imp-mode', mode);
    }
    document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
    addEventListener('resize', () => {
        const sel = document.querySelector('.modes button[aria-selected="true"]');
        if (sel) moveIndicator($('modes'), sel);
        renderPriority();
    });

    // Textareas auto-extensibles + Entrée pour envoyer
    function autoResize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
    function wireTextarea(textarea, form, onChange) {
        textarea.addEventListener('input', () => { autoResize(textarea); onChange(); });
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
        });
    }

    async function post(url, data) {
        const res = await fetch(url, { method: 'POST', body: data });
        let json = {};
        try { json = await res.json(); } catch (e) {}
        if (!res.ok || json.status !== 'success') throw new Error(json.message || 'Une erreur est survenue.');
        return json;
    }
    const btnContent = new Map();
    function setBusy(btn, busy) {
        if (!btnContent.has(btn)) btnContent.set(btn, btn.innerHTML);
        btn.innerHTML = busy ? '<div class="spinner"></div>' : btnContent.get(btn);
        btn.disabled = busy;
    }

    // —— Mode message ——
    const nameInput = $('nameInput'), messageInput = $('messageInput'), messageSend = $('messageSend');
    nameInput.value = store.get('imp-name') || '';
    function updateMessageState() {
        $('messageCount').textContent = messageInput.value.length + '/500';
        messageSend.disabled = !messageInput.value.trim();
    }
    wireTextarea(messageInput, $('messageForm'), updateMessageState);
    nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); messageInput.value.trim() ? $('messageForm').requestSubmit() : messageInput.focus(); }
    });

    $('messageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!messageInput.value.trim()) { shake($('messageForm')); messageInput.focus(); return; }
        const name = nameInput.value.trim();
        if (!name) { shake(nameInput); nameInput.focus(); toast('Indique ton prénom pour que je sache qui m\'écrit 🙂', false); return; }
        setBusy(messageSend, true);
        try {
            const fd = new FormData();
            fd.append('name', name);
            fd.append('message', messageInput.value.trim());
            await post('/message', fd);
            store.set('imp-name', name);
            messageInput.value = ''; autoResize(messageInput);
            toast('💌 Message envoyé, merci ' + name + ' !');
            launchConfetti();
        } catch (err) {
            toast(err.message, false);
        } finally {
            setBusy(messageSend, false);
            updateMessageState();
        }
    });

    // —— Déverrouillage ——
    $('unlockForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('password', $('passwordInput').value);
        try {
            await post('/unlock', fd);
            tasksUnlocked = true;
            $('passwordInput').value = '';
            toast('🔓 Accès débloqué');
            setMode('tasks');
        } catch (err) {
            shake($('unlockForm'));
            $('passwordInput').select();
            toast(err.message, false);
        }
    });

    // —— Mode tâches ——
    const priorities = ['⚡️', '⚡️⚡️', '⚡️⚡️⚡️'];
    let currentPriorityIndex = 0;
    const taskInput = $('taskInput'), taskSend = $('taskSend');
    function renderPriority() {
        $('prioritySeg').querySelectorAll('button').forEach(b => {
            const on = +b.dataset.p === currentPriorityIndex;
            b.setAttribute('aria-pressed', on);
            if (on) moveIndicator($('prioritySeg'), b);
        });
    }
    $('prioritySeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        currentPriorityIndex = +b.dataset.p; renderPriority();
    }));
    function updateTaskState() { taskSend.disabled = !taskInput.value.trim(); }
    wireTextarea(taskInput, $('taskForm'), updateTaskState);

    $('taskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!taskInput.value.trim()) { shake($('taskForm')); return; }
        setBusy(taskSend, true);
        try {
            const fd = new FormData();
            fd.append('task', taskInput.value.trim());
            fd.append('priority', priorities[currentPriorityIndex]);
            await post('/print', fd);
            taskInput.value = ''; autoResize(taskInput);
            currentPriorityIndex = 0; renderPriority();
            toast('✅ Ticket imprimé avec succès !');
            launchConfetti();
        } catch (err) {
            if (/mot de passe/i.test(err.message)) { tasksUnlocked = false; setMode('tasks'); }
            toast(err.message, false);
        } finally {
            setBusy(taskSend, false);
            updateTaskState();
        }
    });

    // Démarrage : la lumière apparaît d'abord, puis l'interface
    setMode(store.get('imp-mode') === 'tasks' ? 'tasks' : 'message');
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
        const sel = document.querySelector('.modes button[aria-selected="true"]');
        moveIndicator($('modes'), sel); renderPriority();
    });
    setTimeout(() => document.body.classList.add('ready'), 700);
    </script>
</body>
</html>
